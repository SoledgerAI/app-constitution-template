# EVENT_MODEL.yaml — reconciliation ledger (worked example)
version: 1

conventions:
  naming: "past_tense — <noun>_<verb>"
  envelope: { event_id: uuid, occurred_at: timestamp, org_id: string, actor_id: string, version: int }
  pii: "ids and hashes only"
  ordering: "append-only; consumers tolerate at-least-once delivery"

events:

  entry_ingested:
    producer: ingest service
    consumer: [normalizer, observability]
    schema: { entry_id: string, source_id: string, external_ref: string, amount_minor: int, currency: string, value_date: date }
    idempotency: "(org_id, source_id, external_ref)"
    retention: forever
    drives_invariant: INV-5

  entry_normalized:
    producer: normalizer
    consumer: [matcher]
    schema: { entry_id: string, period_id: string, amount_minor: int, currency: string }
    idempotency: "entry_id + version"
    retention: forever
    drives_invariant: none

  entry_matched:
    producer: "matcher (ledger_entry: normalized->matched)"
    consumer: [ledger, observability]
    schema: { entry_id: string, match_id: string, residual_minor: int }
    idempotency: "match_id + entry_id"
    retention: forever
    drives_invariant: INV-1

  exception_opened:
    producer: "matcher (ledger_entry: normalized->exception_open)"
    consumer: [exception_queue, observability]
    schema: { exception_id: string, entry_ids: "int[]", reason: string, materiality: string }
    idempotency: "exception_id"
    retention: forever
    drives_invariant: INV-1, INV-6

  exception_resolved:
    producer: exception service
    consumer: [period_close, observability]
    schema: { exception_id: string, resolution_ref: string }
    idempotency: "exception_id + state"
    retention: forever
    drives_invariant: INV-6

  entry_carried_forward:
    producer: period service
    consumer: [next_period, observability]
    schema: { entry_id: string, origin_period_id: string, target_period_id: string }
    idempotency: "entry_id + target_period_id"
    retention: forever
    drives_invariant: INV-9

  adjustment_posted:
    producer: "ledger (adjustment: ->posted)"
    consumer: [general_ledger, observability]
    schema: { adj_id: string, lines: "object[]", period_id: string, reverses_adj_id: "string|null" }
    idempotency: "adj_id"
    retention: forever
    drives_invariant: INV-3, INV-4

  period_closed:
    producer: "period service (period: closing->closed)"
    consumer: [freeze, reporting, observability]
    schema: { period_id: string, closed_by: string, closed_at: timestamp }
    idempotency: "period_id"
    retention: forever
    drives_invariant: INV-6, INV-7

  period_reopened:
    producer: "period service (period: closed->reopened)"
    consumer: [unfreeze, audit, observability]
    schema: { period_id: string, reopened_by: string, reason: string }
    idempotency: "period_id + version"
    retention: forever
    drives_invariant: INV-7

# Triggers — the commands/causes that drive STATE_MACHINES.yaml transitions.
# Triggers are a SEPARATE namespace from events: a trigger names *why* a transition
# fires; `emits` is the event it produces, and null is valid (most lifecycle steps
# move state without publishing an event). Every transition `event:` in
# STATE_MACHINES.yaml must appear here — the constitution gate enforces it.
triggers:
  # ledger_entry
  entry_normalized:      { emits: entry_normalized }
  entry_matched:         { emits: entry_matched }
  entry_excepted:        { emits: exception_opened }
  entry_written_off:     { emits: exception_resolved }
  entry_carried_forward: { emits: entry_carried_forward }
  # exception
  exception_resolved:    { emits: exception_resolved }
  exception_claimed:     { emits: null }
  exception_waived:      { emits: exception_resolved }
  exception_escalated:   { emits: null }
  exception_closed:      { emits: null }
  # reconciliation_run
  run_started:           { emits: null }
  ingest_complete:       { emits: null }
  matching_complete:     { emits: null }
  run_balanced:          { emits: null }
  run_unbalanced:        { emits: null }
  run_closed:            { emits: null }
  run_reopened:          { emits: null }
  run_failed:            { emits: null }
  # adjustment
  adjustment_posted:     { emits: null }
  adjustment_submitted:  { emits: null }
  adjustment_approved:   { emits: null }
  adjustment_rejected:   { emits: null }
  adjustment_reversed:   { emits: null }
  # period
  first_run_started:     { emits: null }
  close_requested:       { emits: null }
  period_closed:         { emits: null }
  period_reopened:       { emits: null }
