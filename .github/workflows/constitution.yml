name: Constitution Gate

# Governance before generation. This workflow runs the constitution validator
# on every push and pull request. If any required check fails, the job fails
# (red X), which blocks merge when the branch is protected. This is the
# mechanical enforcement behind ci/constitution-checks.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  validate:
    name: Validate app constitution package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Run constitution validator
        run: python3 ci/constitution_validate.py
        # To make warnings (e.g. unmodeled events) also block, add: --strict

      - name: Run validator fixture regression suite
        # The validator only proves the *current* packages pass. This suite proves
        # the validator itself still CATCHES every failure mode (and doesn't
        # false-positive on the clean ones). If a hardened check is ever loosened,
        # the matching fixture turns red here.
        run: python3 tests/run_validator_tests.py
